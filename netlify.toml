# Netlify builds the static export and serves out/, with Storybook at
# /storybook. Node comes from .node-version, pnpm from the packageManager field
# in package.json.
[build]
  command = "pnpm build && pnpm exec storybook build --config-dir .storybook -o out/storybook --quiet"
  publish = "out"

[build.environment]
  # Lint and test hooks are for local commits, not Netlify builds
  HUSKY = "0"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    # SAMEORIGIN rather than DENY: Storybook shows each story in a frame of its own page
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
